name: Docker images & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-api
            context: .
            dockerfile: src/Services/Identity/Academies.Identity.Api/Dockerfile
          - name: subscription-api
            context: .
            dockerfile: src/Services/Subscription/Academies.Subscription.Api/Dockerfile
          - name: academic-api
            context: .
            dockerfile: src/Services/Academic/Academies.Academic.Api/Dockerfile
          - name: finance-api
            context: .
            dockerfile: src/Services/Finance/Academies.Finance.Api/Dockerfile
          - name: engagement-api
            context: .
            dockerfile: src/Services/Engagement/Academies.Engagement.Api/Dockerfile
          - name: gateway
            context: .
            dockerfile: src/Gateway/Academies.Gateway/Dockerfile
          - name: client
            context: client
            dockerfile: client/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # GHCR names must be lowercase; github.repository keeps the owner's casing.
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Build stages run natively (--platform=$BUILDPLATFORM); QEMU only runs the tiny final stages.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}/${{ matrix.name }}:latest
            ${{ steps.prefix.outputs.value }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Ships the images to the server over SSH. Skipped until the DEPLOY_HOST secret exists
  # (setup: deploy/README.md).
  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret not set; skipping deploy."
      - if: env.DEPLOY_HOST != ''
        uses: actions/checkout@v4
      - if: env.DEPLOY_HOST != ''
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - if: env.DEPLOY_HOST != ''
        name: Copy deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/deploy.sh,deploy/.env.prod.example,deploy/mysql/init.sql
          target: academies
          strip_components: 1
      - if: env.DEPLOY_HOST != ''
        name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ steps.prefix.outputs.value }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_PREFIX IMAGE_TAG
            bash ~/academies/deploy.sh
            docker logout ghcr.io
