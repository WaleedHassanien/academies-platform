# Full stack: MySQL, Redis, RabbitMQ, 5 services, gateway and the Angular client.
#   cp .env.example .env
#   docker compose up -d --build
# Host ports live in docker-compose.override.yml (picked up automatically).
name: academies

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ConnectionStrings__Database: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-academies};Uid=${MYSQL_USER:-academies};Pwd=${MYSQL_PASSWORD:-academies};AllowPublicKeyRetrieval=true;
  ConnectionStrings__Redis: redis:6379
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-academies}:${RABBITMQ_PASSWORD:-academies}@rabbitmq:5672
  Jwt__Authority: http://identity-api:8080
  Internal__ApiKey: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
  Services__Identity: http://identity-api:8080
  Services__Subscription: http://subscription-api:8080
  Services__Academic: http://academic-api:8080
  Services__Finance: http://finance-api:8080
  Services__Engagement: http://engagement-api:8080
  Email__SmtpHost: ${SMTP_HOST:-}
  Email__UserName: ${SMTP_USER:-}
  Email__Password: ${SMTP_PASSWORD:-}

x-dotnet-deps: &dotnet-deps
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-academies}
      MYSQL_USER: ${MYSQL_USER:-academies}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-academies}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-academies}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-academies}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Academies.Identity.Api/Dockerfile
    environment:
      <<: *dotnet-env
      Jwt__SigningKeyPath: /app/keys/signing.pem
      Seed__SuperAdminPassword: ${SEED_SUPERADMIN_PASSWORD:-SuperAdmin!2026}
      Seed__DemoAdminPassword: ${SEED_DEMO_ADMIN_PASSWORD:-Admin!2026}
    volumes:
      - identity-keys:/app/keys
    depends_on: *dotnet-deps

  subscription-api:
    build:
      context: .
      dockerfile: src/Services/Subscription/Academies.Subscription.Api/Dockerfile
    environment: *dotnet-env
    depends_on: *dotnet-deps

  academic-api:
    build:
      context: .
      dockerfile: src/Services/Academic/Academies.Academic.Api/Dockerfile
    environment: *dotnet-env
    depends_on: *dotnet-deps

  finance-api:
    build:
      context: .
      dockerfile: src/Services/Finance/Academies.Finance.Api/Dockerfile
    environment:
      <<: *dotnet-env
      Payments__Provider: ${PAYMENTS_PROVIDER:-Fake}
      Payments__PublicBaseUrl: http://localhost:4200
      Payments__ReturnUrl: http://localhost:4200/parent
      Payments__PayPal__ClientId: ${PAYPAL_CLIENT_ID:-}
      Payments__PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:-}
      Payments__PayPal__Mode: ${PAYPAL_MODE:-sandbox}
      Payments__PayPal__WebhookId: ${PAYPAL_WEBHOOK_ID:-}
      Payments__PayPal__ExchangeRates__EGP: ${PAYPAL_EGP_TO_USD:-0.0206}
      Payments__PayPal__ExchangeRates__SAR: ${PAYPAL_SAR_TO_USD:-0.2667}
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Payments__AutoPay__Provider: ${AUTOPAY_PROVIDER:-}
    depends_on: *dotnet-deps

  engagement-api:
    build:
      context: .
      dockerfile: src/Services/Engagement/Academies.Engagement.Api/Dockerfile
    environment: *dotnet-env
    depends_on: *dotnet-deps

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Academies.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Cors__AllowedOrigins__0: http://localhost:4200
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity-api:8080
      ReverseProxy__Clusters__subscription__Destinations__d1__Address: http://subscription-api:8080
      ReverseProxy__Clusters__academic__Destinations__d1__Address: http://academic-api:8080
      ReverseProxy__Clusters__finance__Destinations__d1__Address: http://finance-api:8080
      ReverseProxy__Clusters__engagement__Destinations__d1__Address: http://engagement-api:8080
    depends_on:
      - identity-api
      - subscription-api
      - academic-api
      - finance-api
      - engagement-api

  client:
    build:
      context: ./client
    depends_on:
      - gateway

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  identity-keys:
